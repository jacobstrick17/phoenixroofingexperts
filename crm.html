/* Books against the same calendar and the same capacity rules as the website,
   so a slot sold on a doorstep can never collide with one booked online. */
async function doorBookModal(){
  var cap = Number(cache.settings.slot_capacity || 2);
  var days = Number(cache.settings.booking_days_out || 21);
  var m = modal("Book the inspection",
    '<form id="dbf" class="stack">'
    + '<div class="fg"><div class="field"><label>Name*</label><input id="dbn" required></div>'
    + '<div class="field"><label>Phone*</label><input id="dbp" type="tel" inputmode="tel" required></div></div>'
    + '<div class="field"><label>Email</label><input id="dbe" type="email"></div>'
    + '<div class="field"><label>What is going on with the roof</label><input id="dbc" placeholder="Tiles sliding on the back slope"></div>'
    + '<div class="field"><label>Day</label><select id="dbd"><option>Loading…</option></select></div>'
    + '<div class="field"><label>Window</label><select id="dbw">'
      + '<option value="morning">Morning (8–12)</option><option value="afternoon">Afternoon (12–4)</option></select></div>'
    + '<div id="dberr"></div>'
    + '<div class="macts"><button type="button" class="btn" data-cancel>Cancel</button>'
    + '<button type="submit" class="btn btn-p">Book it</button></div></form>');
  m.querySelector("[data-cancel]").onclick = function(){ document.body.removeChild(m); };

  var load = {};
  try{
    (await rpc("slot_load", { days: days }) || []).forEach(function(r){
      load[r.slot_date + "|" + r.slot_window] = Number(r.taken);
    });
  }catch(e){ /* an unreachable slot table must not block writing the lead down */ }

  var opts = [], d = new Date();
  for(var i=0;i<days;i++){
    var day = new Date(d.getTime() + i*864e5);
    if(day.getDay() === 0) continue;                       // closed Sunday
    var iso = day.toISOString().slice(0,10);
    var mFull = (load[iso+"|morning"]||0) >= cap, aFull = (load[iso+"|afternoon"]||0) >= cap;
    if(mFull && aFull) continue;
    opts.push('<option value="'+iso+'">' + apptDate(iso)
      + (mFull ? " (afternoon only)" : aFull ? " (morning only)" : "") + '</option>');
  }
  el("dbd").innerHTML = opts.join("") || '<option value="">No slots open</option>';

  m.querySelector("#dbf").onsubmit = async function(ev){
    ev.preventDefault();
    var err = m.querySelector("#dberr");
    try{
      var kr = await post("knocks", knockPayload("appointment"));
      var knockId = kr && kr[0] ? kr[0].id : null;
      var res = await rpc("book_from_door", {
        p_name: el("dbn").value.trim(), p_phone: el("dbp").value.trim(),
        p_address: el("kaddr").value.trim(), p_city: el("kcity").value.trim() || null,
        p_concern: el("dbc").value.trim() || null,
        p_date: el("dbd").value, p_window: el("dbw").value,
        p_email: el("dbe").value.trim() || null,
        p_notes: "Set at the door" + (el("kroute").value.trim() ? " — " + el("kroute").value.trim() : ""),
        p_knock_id: knockId
      });
      if(!res || !res.ok){
        var msg = { slot_full:"That slot just filled. Pick another day.",
                    date_too_far:"That is further out than the calendar runs.",
                    closed_sunday:"Sundays are closed.",
                    phone_required:"A phone number is required.",
                    address_required:"An address is required." }[res && res.reason] || "Could not book that slot.";
        throw new Error(msg);
      }
      document.body.removeChild(m);
      el("kaddr").value = "";
      await loadAll();
      toast("Booked — it is on the Visits calendar");
      viewDoors();
    }catch(e2){
      err.innerHTML = '<div class="banner err">' + esc(e2.message) + '</div>';
    }
  };
}

/* ==========================================================================
   MAP — a small slippy map over OpenStreetMap tiles.
   Written out rather than pulled from a CDN: this page holds customer names,
   addresses and phone numbers, and a third-party script here would be able to
   read all of it. Tiles are images, which cannot.
   ========================================================================== */

var MAP = { ready:false, zoom:17, center:{lat:33.4484,lng:-112.0740}, el:null, tiles:null, pins:null };

function lngToX(lng, z){ return (lng + 180) / 360 * 256 * Math.pow(2, z); }
function latToY(lat, z){
  var s = Math.sin(lat * Math.PI / 180);
  s = Math.max(-0.9999, Math.min(0.9999, s));
  return (0.5 - Math.log((1 + s) / (1 - s)) / (4 * Math.PI)) * 256 * Math.pow(2, z);
}
function xToLng(x, z){ return x / (256 * Math.pow(2, z)) * 360 - 180; }
function yToLat(y, z){
  var n = Math.PI - 2 * Math.PI * y / (256 * Math.pow(2, z));
  return 180 / Math.PI * Math.atan(0.5 * (Math.exp(n) - Math.exp(-n)));
}

function initKnockMap(){
  var box = el("kmap"); if(!box) return;
  MAP.el = box; MAP.tiles = el("ktiles"); MAP.pins = el("kpins"); MAP.ready = true;

  var pts = cache.knocks.filter(function(k){ return k.lat != null && k.lng != null; });
  if(DOOR.lat != null){ MAP.center = { lat:DOOR.lat, lng:DOOR.lng }; }
  else if(pts.length){
    MAP.center = { lat: pts.reduce(function(a,k){ return a+Number(k.lat); },0)/pts.length,
                   lng: pts.reduce(function(a,k){ return a+Number(k.lng); },0)/pts.length };
  }

  var drag = null;
  box.onpointerdown = function(ev){
    if(ev.target.closest(".mzoom")) return;
    drag = { x:ev.clientX, y:ev.clientY, moved:false };
    box.classList.add("drag");
    box.setPointerCapture(ev.pointerId);
  };
  box.onpointermove = function(ev){
    if(!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    if(Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
    MAP.tiles.style.transform = "translate(" + dx + "px," + dy + "px)";
    MAP.pins.style.transform  = "translate(" + dx + "px," + dy + "px)";
  };
  box.onpointerup = box.onpointercancel = function(ev){
    if(!drag) return;
    var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
    drag = null;
    box.classList.remove("drag");
    MAP.tiles.style.transform = ""; MAP.pins.style.transform = "";
    if(!dx && !dy) return;
    var z = MAP.zoom;
    MAP.center = { lat: yToLat(latToY(MAP.center.lat, z) - dy, z),
                   lng: xToLng(lngToX(MAP.center.lng, z) - dx, z) };
    drawMap();
  };
  el("kzin").onclick  = function(){ MAP.zoom = Math.min(19, MAP.zoom + 1); drawMap(); };
  el("kzout").onclick = function(){ MAP.zoom = Math.max(11, MAP.zoom - 1); drawMap(); };

  drawMap();
  wireKnockList();
}

function drawMap(){
  if(!MAP.ready || !MAP.el) return;
  var z = MAP.zoom, w = MAP.el.clientWidth, h = MAP.el.clientHeight;
  if(!w || !h) return;
  var cx = lngToX(MAP.center.lng, z), cy = latToY(MAP.center.lat, z);
  var ox = cx - w/2, oy = cy - h/2;
  var n = Math.pow(2, z);

  var html = "";
  for(var tx = Math.floor(ox/256); tx <= Math.floor((ox+w)/256); tx++){
    for(var ty = Math.floor(oy/256); ty <= Math.floor((oy+h)/256); ty++){
      if(ty < 0 || ty >= n) continue;
      var wx = ((tx % n) + n) % n;                       // wrap across the date line
      html += '<img alt="" loading="lazy" src="https://tile.openstreetmap.org/'
        + z + '/' + wx + '/' + ty + '.png" style="left:' + (tx*256 - ox)
        + 'px;top:' + (ty*256 - oy) + 'px">';
    }
  }
  MAP.tiles.innerHTML = html;

  var pins = cache.knocks.filter(function(k){ return k.lat != null && k.lng != null; })
    .map(function(k){
      var x = lngToX(Number(k.lng), z) - ox, y = latToY(Number(k.lat), z) - oy;
      if(x < -20 || y < -20 || x > w+20 || y > h+20) return "";
      return '<div class="pin p-' + esc(k.disposition) + '" style="left:' + x + 'px;top:' + y + 'px" '
        + 'title="' + esc(k.address) + ' — ' + esc(DISPOSITIONS[k.disposition]||k.disposition) + '"></div>';
    }).join("");
  if(DOOR.lat != null){
    var mx = lngToX(DOOR.lng, z) - ox, my = latToY(DOOR.lat, z) - oy;
    pins += '<div class="pin me" style="left:' + mx + 'px;top:' + my + 'px" title="You"></div>';
  }
  MAP.pins.innerHTML = pins;
}

/* ==========================================================================
   SALES NUMBERS
   ========================================================================== */

var KPI = { days:30, data:null };

function viewSales(){
  el("main").innerHTML =
    '<div class="head"><div><h1>Sales</h1><p class="muted">Where the money actually comes from.</p></div>'
    + '<div class="rowbtns">'
      + [7,30,90].map(function(d){
          return '<button class="btn' + (KPI.days===d?' btn-p':'') + '" data-days="' + d + '">' + d + ' days</button>';
        }).join("")
    + '</div></div><div id="kpibox"><div class="hint">Loading numbers&hellip;</div></div>';

  Array.prototype.forEach.call(document.querySelectorAll("[data-days]"), function(b){
    b.onclick = function(){ KPI.days = Number(b.getAttribute("data-days")); KPI.data = null; viewSales(); };
  });

  rpc("sales_kpis", { p_days: KPI.days }).then(function(d){
    KPI.data = d; renderKpis();
  }).catch(function(e){
    el("kpibox").innerHTML = '<div class="banner err">' + esc(e.message) + '</div>';
  });
}

function pct(v){ return v == null ? "&mdash;" : v + "%"; }

function renderKpis(){
  var d = KPI.data; if(!d) return;
  var e = d.estimates, k = d.doors, p = d.pipeline;

  function stat(k2, v, s){
    return '<div class="stat"><div class="k">' + k2 + '</div><div class="v">' + v + '</div>'
      + (s ? '<div class="s">' + s + '</div>' : '') + '</div>';
  }

  /* Estimates that went out, were opened, and then went quiet. This is the
     list that is worth a phone call this afternoon. */
  var stale = cache.estimates.filter(function(x){
    return (x.status === "sent" || x.status === "viewed")
        && x.sent_at && (Date.now() - new Date(x.sent_at)) > 2*864e5;
  }).sort(function(a,b){ return new Date(a.sent_at) - new Date(b.sent_at); });

  el("kpibox").innerHTML =
    '<h3 style="margin-top:6px">Estimates</h3><div class="stats">'
    + stat("Sent", e.sent, e.opened + " opened")
    + stat("Close rate", pct(e.accept_rate), e.accepted + " of " + (e.accepted + e.declined) + " decided")
    + stat("Sold", usd(e.sold_value), e.accepted + " accepted")
    + stat("Average ticket", e.avg_ticket ? usd(e.avg_ticket) : "&mdash;")
    + stat("Still open", e.open, e.open ? "waiting on an answer" : "nothing pending")
    + stat("Days to decide", e.median_hours_to_decision != null
        ? (Math.round(e.median_hours_to_decision/24*10)/10) : "&mdash;", "median")
    + '</div>'

    + '<h3>Doors</h3><div class="stats">'
    + stat("Knocked", k.knocked)
    + stat("Contact rate", pct(k.contact_rate), k.answered + " answered")
    + stat("Appointments", k.appointments, k.doors_per_appt ? k.doors_per_appt + " doors each" : "")
    + stat("Callbacks", k.callbacks, "worth going back to")
    + '</div>'

    + '<h3>Pipeline</h3><div class="stats">'
    + stat("New leads", p.leads)
    + stat("Open pipeline", usd(p.open_value), p.open_deals + " deals still winnable")
    + stat("Signed", p.sold, usd(p.sold_value))
    + stat("Completed", p.won)
    + stat("Lost", p.lost)
    + stat("Visits booked", p.appts_set, p.no_shows ? p.no_shows + " no-show" : "")
    + '</div>'

    + '<section class="panel"><h3>Estimates gone quiet</h3>'
    + (stale.length ? stale.map(function(x){
        var c = contactById(x.contact_id) || {};
        var age = Math.round((Date.now() - new Date(x.sent_at))/864e5);
        return '<div class="drow"><div><div class="dtitle">' + esc(c.name||"(unknown)") + ' &middot; ' + esc(x.number) + '</div>'
          + '<div class="muted">' + estChip(x.status) + ' sent ' + age + ' days ago'
          + (x.first_viewed_at ? ' &middot; opened ' + x.view_count + '&times;' : ' &middot; never opened')
          + '</div></div><div class="rowbtns">'
          + (c.phone ? '<a class="btn" href="tel:' + esc(c.phone) + '">Call</a>' : '')
          + '<button class="btn" data-openest="' + x.id + '">Open</button></div></div>';
      }).join("") : '<div class="hint">Nothing sitting. Good.</div>')
    + '</section>'

    + '<section class="panel"><h3>Where leads came from</h3>'
    + (Object.keys(p.by_source||{}).length
        ? Object.keys(p.by_source).sort(function(a,b){ return p.by_source[b]-p.by_source[a]; })
            .map(function(s){
              return '<div class="totline"><span>' + srcBadge(s) + '</span><span class="num">'
                + p.by_source[s] + '</span></div>';
            }).join("")
        : '<div class="hint">No leads in this window.</div>')
    + '</section>';

  Array.prototype.forEach.call(document.querySelectorAll("[data-openest]"), function(b){
    b.onclick = function(){ EST = null; go("estimate", { estimateId: b.getAttribute("data-openest") }); };
  });
}

/* ---------- boot ---------- */
var mapResizeTimer = null;
window.addEventListener("resize", function(){
  if(!MAP.ready || view.name !== "doors") return;
  clearTimeout(mapResizeTimer);
  mapResizeTimer = setTimeout(drawMap, 150);
});

(async function(){
  session = loadSession();
  if(session){
    try { await loadAll(); }
    catch(e){
      if(await refreshSession()){
        try { await loadAll(); } catch(e2){ signOut(); return; }
      } else { signOut(); return; }
    }
  }
  render();
})();
</script>
