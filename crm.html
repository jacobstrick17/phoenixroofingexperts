<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Phoenix Roofing Experts — CRM</title>
<link rel="icon" href="data:,">
<style>
:root{
  --navy:#0f2438;--navy-d:#0a1826;--orange:#e8590c;--orange-d:#c94a08;
  --g50:#f7f8fa;--g100:#eef0f3;--g200:#dfe3e8;--g500:#6b7684;--g700:#33404f;
  --white:#fff;--r:10px;--sh:0 2px 10px rgba(15,36,56,.06);--shl:0 16px 40px rgba(15,36,56,.18);
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--g700);background:var(--g50);-webkit-font-smoothing:antialiased}
h1{font-size:1.55rem;margin:0 0 4px;color:var(--navy)}
h2{font-size:1.2rem;margin:0 0 4px;color:var(--navy)}
h3{margin:0 0 14px;color:var(--navy);font-size:1.02rem}
.muted{color:var(--g500);font-size:.9rem}
a{color:var(--orange);text-decoration:none}
a:hover{text-decoration:underline}
button{font-family:inherit}
.btn{background:var(--white);border:1px solid var(--g200);color:var(--g700);padding:10px 18px;
  border-radius:8px;font-weight:600;font-size:.9rem;cursor:pointer}
.btn:hover{background:var(--g100)}
.btn-p{background:var(--orange);color:#fff;border-color:var(--orange)}
.btn-p:hover{background:var(--orange-d)}
.btn:disabled{opacity:.6;cursor:default}
.linkbtn{background:none;border:none;color:var(--g500);font-size:.85rem;cursor:pointer;
  padding:4px 0;text-decoration:underline}
.linkbtn:hover{color:var(--orange)}
input,select,textarea{font-family:inherit;padding:10px 12px;border-radius:8px;
  border:1px solid var(--g200);font-size:.9rem;width:100%;background:#fff;color:var(--g700)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);outline-offset:1px}
.banner{padding:12px 16px;border-radius:8px;margin-bottom:16px;font-size:.9rem}
.banner.err{background:#fdecea;color:#b3261e;border:1px solid #f5c2bf}
.banner.ok{background:#e9f7f0;color:#12684a;border:1px solid #b6e3ce}

/* boot + login */
.boot{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--g500)}
.loginwrap{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;background:var(--navy-d)}
.logincard{background:#fff;border-radius:var(--r);padding:34px;width:100%;max-width:400px;box-shadow:var(--shl)}
.brandrow{display:flex;align-items:center;gap:10px;padding-bottom:20px;margin-bottom:20px;border-bottom:1px solid var(--g100)}
.bmark{font-size:1.6rem}
.bname{font-weight:700;color:var(--navy);font-size:.95rem;line-height:1.2}
.bsub{font-size:.75rem;color:var(--orange);font-weight:600}
.stack{display:flex;flex-direction:column;gap:14px}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--navy);margin-bottom:5px}
.logincard .btn{width:100%}

/* shell */
.shell{display:flex;min-height:100vh}
.side{width:225px;background:var(--navy-d);color:#cfd8e3;display:flex;flex-direction:column;padding:22px 16px;flex-shrink:0}
.side .brandrow{border-bottom:none;padding-bottom:0;margin-bottom:28px}
.side .bname{color:#fff}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{background:none;border:none;color:#cfd8e3;text-align:left;padding:10px 12px;border-radius:8px;
  font-size:.92rem;font-weight:500;cursor:pointer;width:100%}
.nav button:hover{background:rgba(255,255,255,.06)}
.nav button.on{background:var(--orange);color:#fff;font-weight:700}
.sidefoot{margin-top:auto;font-size:.75rem;color:#6f8098;padding-top:14px;border-top:1px solid #1c3348}
.who{font-size:.74rem;color:#cfd8e3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-bottom:2px}
.sidefoot .linkbtn{color:#8fa0b3}
.main{flex:1;padding:30px 36px;overflow-x:auto}
.head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px;gap:16px;flex-wrap:wrap}

/* board */
.board{display:flex;gap:15px;overflow-x:auto;padding-bottom:12px}
.col{background:var(--g100);border-radius:var(--r);min-width:255px;width:255px;flex-shrink:0;
  display:flex;flex-direction:column;max-height:calc(100vh - 165px)}
.colhead{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;
  font-weight:700;font-size:.84rem;color:var(--navy);border-top:4px solid var(--g200);border-radius:var(--r) var(--r) 0 0}
.pill{background:#fff;border-radius:999px;padding:1px 9px;font-size:.74rem;color:var(--g500)}
.colbody{padding:0 10px 10px;overflow-y:auto;display:flex;flex-direction:column;gap:10px;min-height:40px}
.deal{background:#fff;border-radius:8px;padding:12px;box-shadow:var(--sh);cursor:grab}
.deal.drag{opacity:.45}
.dtitle{font-weight:700;font-size:.9rem;color:var(--navy);margin-bottom:3px}
.dsvc{font-size:.77rem;color:var(--g500);margin-top:2px}
.dmeta{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:6px}
.dval{font-weight:700;font-size:.84rem;color:var(--navy)}
.dmeta select{font-size:.71rem;padding:4px;max-width:112px;width:auto}
.hint{color:var(--g500);font-size:.8rem;padding:10px 4px}

/* table */
.search{max-width:400px;margin-bottom:18px}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
th{text-align:left;font-size:.72rem;text-transform:uppercase;letter-spacing:.5px;color:var(--g500);
  padding:12px 16px;border-bottom:1px solid var(--g200)}
td{padding:12px 16px;border-bottom:1px solid var(--g100);font-size:.89rem}
tr:last-child td{border-bottom:none}
.rlink{color:var(--navy);font-weight:700;cursor:pointer;background:none;border:none;padding:0;font-size:.89rem;font-family:inherit}
.rlink:hover{color:var(--orange);text-decoration:underline}
.badge{display:inline-block;padding:3px 10px;border-radius:999px;font-size:.71rem;font-weight:700;color:#fff;background:var(--g500)}
.b-web{background:#2563eb}.b-solar{background:#0d7a72}.b-manual{background:#6b7684}

/* detail */
.back{color:var(--g500);font-size:.85rem;cursor:pointer;background:none;border:none;padding:0;margin-bottom:10px;font-family:inherit}
.back:hover{color:var(--orange)}
.dgrid{display:grid;grid-template-columns:1.6fr 1fr;gap:20px;align-items:flex-start}
.panel{background:#fff;border-radius:var(--r);padding:20px;box-shadow:var(--sh);margin-bottom:20px}
.drow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--g100);gap:10px}
.drow:last-child{border-bottom:none}
.inline{display:flex;gap:8px;margin-bottom:16px}
.tl{display:flex;flex-direction:column;gap:14px}
.tli{display:flex;gap:10px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--orange);margin-top:6px;flex-shrink:0}
.tlb{font-size:.87rem}
.tlm{font-size:.74rem;color:var(--g500);margin-top:2px;text-transform:capitalize}
.tasks{display:flex;flex-direction:column;gap:8px;margin-top:14px}
.task{display:flex;align-items:center;gap:10px;font-size:.87rem;padding:6px 0}
.task.done span:first-of-type{text-decoration:line-through;color:var(--g500)}
.task input[type=checkbox],.taskrow input[type=checkbox],.cbx{width:16px;height:16px;accent-color:var(--orange);cursor:pointer;flex-shrink:0}
.taskrow{display:flex;justify-content:space-between;align-items:center;background:#fff;padding:12px 16px;
  border-radius:8px;box-shadow:var(--sh);gap:12px}
.taskrow.over{border-left:3px solid #d64545}
.overtxt{color:#d64545;font-weight:700}

/* modal */
.ovl{position:fixed;inset:0;background:rgba(10,24,38,.5);display:flex;align-items:center;
  justify-content:center;z-index:100;padding:20px}
.modal{background:#fff;border-radius:var(--r);width:100%;max-width:480px;max-height:90vh;
  overflow-y:auto;box-shadow:var(--shl)}
.mhead{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-bottom:1px solid var(--g100)}
.mbody{padding:22px}
.icon{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--g500)}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.macts{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}

.b-resto{background:#b8281f}
.rvacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rvacts .btn{padding:8px 14px;font-size:.84rem}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.shots img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;
  border:1px solid var(--g200);background:var(--g100)}
.shots a{display:block}
.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* ---------- tablet ---------- */
@media(max-width:900px){
  .shell{flex-direction:column}
  .side{width:100%;flex-direction:row;align-items:center;padding:12px 16px}
  .side .brandrow{margin-bottom:0}
  .nav{flex-direction:row;margin-left:auto}
  .sidefoot{margin:0 0 0 14px;border:none;padding:0}
  .main{padding:20px}
  .dgrid{grid-template-columns:1fr}
  .fg{grid-template-columns:1fr}
}

/* ---------- any touch device ----------
   Text-styled buttons render at their line height, around 15px, which is far
   below what a fingertip can reliably hit. They need an explicit box rather
   than just a bigger font. Keyed to pointer type, not width, so a finger-driven
   iPad gets this and a narrow desktop window does not. */
@media (hover:none) and (pointer:coarse){
  .btn{padding:12px 18px;min-height:44px}
  .linkbtn,.back{padding:9px 0;min-height:40px;display:inline-flex;align-items:center}
  .rlink{min-height:40px;display:inline-flex;align-items:center;padding:4px 0;text-align:left}
  td a[href^="tel:"]{min-height:40px;display:inline-flex;align-items:center;font-weight:600}
  .task,.taskrow{gap:14px}
  /* the whole label is the target, not just the box */
  .task,.taskcb,label.muted{min-height:40px}
  label.muted{display:inline-flex;align-items:center;gap:8px}
  /* HTML5 drag-and-drop does not fire on touch, so on any finger device the
     stage dropdown is the ONLY way to move a deal. It has to be a real control,
     not the 24px afterthought it is on desktop. */
  .dmeta{flex-direction:column;align-items:stretch;gap:8px}
  .dmeta select{max-width:none;width:100%;min-height:44px;padding:10px}
  .task input[type=checkbox],.taskrow input[type=checkbox],.cbx{width:22px;height:22px}
  input,select,textarea{font-size:16px}
}

/* ---------- phone ----------
   At this width the sidebar-as-a-row runs out of room: brand, three nav
   buttons, an email address and a sign-out link cannot share 390px. The nav
   moves to a fixed bottom bar instead — thumb-reachable, and the standard
   place to look for it on a phone. */
@media(max-width:700px){
  html{-webkit-text-size-adjust:100%}

  .side{padding:10px 14px;gap:10px}
  .side .bsub{display:none}
  .side .bname{font-size:.88rem}
  .sidefoot{margin-left:auto;display:flex;align-items:center;gap:10px}
  .who{max-width:38vw;margin-bottom:0}

  /* nav becomes a bottom tab bar */
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:90;margin:0;
    flex-direction:row;background:var(--navy-d);border-top:1px solid #1c3348;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    box-shadow:0 -2px 14px rgba(10,24,38,.3)}
  .nav button{flex:1;text-align:center;font-size:.78rem;padding:10px 4px;border-radius:8px;
    min-height:46px;line-height:1.25}
  .nav button.on{background:var(--orange)}
  /* keep content clear of the bar */
  .main{padding:16px 14px calc(74px + env(safe-area-inset-bottom))}

  h1{font-size:1.3rem}
  .head{gap:12px}
  .head .btn{width:100%}
  .search{max-width:none}

  /* iOS zooms the page when focusing an input under 16px. */
  input,select,textarea{font-size:16px;padding:12px}


  /* Board: one column fills the screen and snaps, instead of three half-visible
     columns fighting for 390px. */
  .board{gap:12px;scroll-snap-type:x mandatory;padding-bottom:8px}
  .col{min-width:84vw;width:84vw;scroll-snap-align:start;
    max-height:none;height:auto}
  .colbody{max-height:60vh}
  .dmeta{flex-direction:column;align-items:stretch;gap:8px}
  .dmeta select{max-width:none;width:100%;font-size:16px;padding:10px;min-height:44px}
  .deal{padding:14px}

  /* Contacts table collapses to one card per contact. A six-column table
     cannot be read on a phone, and side-scrolling a table is worse than
     stacking it. */
  .tscroll{overflow-x:visible}
  table{box-shadow:none;background:transparent}
  thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table,tbody,tr,td{display:block;width:100%}
  tr{background:#fff;border-radius:var(--r);box-shadow:var(--sh);
    margin-bottom:10px;padding:10px 14px 12px}
  td{border-bottom:none;padding:3px 0;font-size:.88rem;
    display:flex;justify-content:space-between;align-items:center;gap:14px}
  td::before{content:attr(data-label);font-size:.7rem;text-transform:uppercase;
    letter-spacing:.5px;color:var(--g500);font-weight:700;flex-shrink:0}

  /* The name is the card's heading, so it gets the full width and no label. */
  td[data-label="Name"]{display:block;padding:0 0 2px}
  td[data-label="Name"]::before{content:none}
  td[data-label="Name"] .rlink{font-size:1.05rem;min-height:40px;width:100%}

  /* Email is always empty for web leads — the forms don't collect it — and the
     full record is one tap away on the detail page. Dropping it here nearly
     halves the card, which is the difference between seeing two contacts per
     screen and seeing four. */
  td[data-label="Email"]{display:none}
  td[data-label="City"],td[data-label="Added"]{color:var(--g500)}
  td[data-label="Address"]{align-items:flex-start}
  td[data-label="Address"]::before{padding-top:1px}
  td[colspan]{display:block;text-align:center;padding:20px 0}
  td[colspan]::before{content:none}

  /* Modals as bottom sheets — easier to reach, and they don't fight the
     on-screen keyboard the way a vertically centred box does. */
  .ovl{padding:0;align-items:flex-end}
  .modal{max-width:none;border-radius:var(--r) var(--r) 0 0;max-height:92vh}
  .mbody{padding:18px 18px calc(18px + env(safe-area-inset-bottom))}
  .macts{flex-direction:column-reverse;gap:8px}
  .macts .btn{width:100%}

  /* let long values wrap instead of squeezing */
  .drow,.taskrow{flex-wrap:wrap}
  .inline{flex-wrap:wrap}
  .inline input{min-width:100%}
}
</style>
</head>
<body>
<div id="root"><div class="boot">Loading…</div></div>

<script>
/* ============================================================================
   Phoenix Roofing Experts CRM — single file, no build step.

   Talks to Supabase's REST and Auth endpoints directly with fetch(), so there
   is nothing to compile and nothing to install. Upload this one file and it
   runs.

   Security note: the key below is the PUBLIC anon key. It is not a secret. What
   it can do is set by Row Level Security in the database — anon can insert a
   lead and nothing else. Every read on this page requires the access token
   issued at login, so an unauthenticated visitor who opens this file sees a
   login screen and can retrieve no data.
   ========================================================================== */

var SB_URL = "https://bghvhowpwbicojgwwirx.supabase.co";
var SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJnaHZob3dwd2JpY29qZ3d3aXJ4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNjI3NDcsImV4cCI6MjEwMjgzODc0N30.zgXQCv9mOuzHT0237HUOL1zBYZeBw5FSgXaUYYeVRyY";

var SESSION_KEY = "pre-crm-session";
var session = null;
var view = { name: "pipeline", contactId: null };
var cache = { stages: [], deals: [], contacts: [], tasks: [], activities: [] };

/* ---------- session storage ---------- */
function loadSession(){
  try { var r = localStorage.getItem(SESSION_KEY); return r ? JSON.parse(r) : null; }
  catch(e){ return null; }
}
function saveSession(s){
  try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); }
  catch(e){}
}

/* ---------- auth ---------- */
async function signIn(email, password){
  var r = await fetch(SB_URL + "/auth/v1/token?grant_type=password", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":SB_KEY },
    body: JSON.stringify({ email:email, password:password })
  });
  var d = await r.json();
  if(!r.ok) throw new Error(d.error_description || d.msg || "Sign in failed");
  session = d; saveSession(d); return d;
}

async function refreshSession(){
  if(!session || !session.refresh_token) return false;
  var r = await fetch(SB_URL + "/auth/v1/token?grant_type=refresh_token", {
    method:"POST",
    headers:{ "Content-Type":"application/json", "apikey":SB_KEY },
    body: JSON.stringify({ refresh_token: session.refresh_token })
  });
  if(!r.ok){ signOut(); return false; }
  session = await r.json(); saveSession(session); return true;
}

function signOut(){
  session = null; saveSession(null); cache = { stages:[], deals:[], contacts:[], tasks:[], activities:[], reviews:[], settings:{}, appts:[] };
  view = { name:"pipeline", contactId:null };
  render();
}

/* ---------- data layer ----------
   Access tokens expire (an hour by default). Rather than making the user log
   in again mid-task, a 401 triggers one silent refresh and the request is
   retried once. */
async function api(path, opts, isRetry){
  opts = opts || {};
  var headers = Object.assign({
    "apikey": SB_KEY,
    "Authorization": "Bearer " + (session ? session.access_token : SB_KEY),
    "Content-Type": "application/json"
  }, opts.headers || {});

  var r = await fetch(SB_URL + "/rest/v1/" + path, Object.assign({}, opts, { headers: headers }));

  if(r.status === 401 && !isRetry){
    if(await refreshSession()) return api(path, opts, true);
    throw new Error("Session expired");
  }
  if(!r.ok) throw new Error((await r.text()) || ("Request failed: " + r.status));
  if(r.status === 204) return null;
  var txt = await r.text();
  return txt ? JSON.parse(txt) : null;
}

var get = function(p){ return api(p, { method:"GET" }); };
var post = function(p, body){
  return api(p, { method:"POST", body:JSON.stringify(body), headers:{ "Prefer":"return=representation" } });
};
var patch = function(p, body){ return api(p, { method:"PATCH", body:JSON.stringify(body) }); };

async function loadAll(){
  var r = await Promise.all([
    get("pipeline_stages?select=*&order=position"),
    get("deals?select=*&order=created_at.desc"),
    get("contacts?select=*&order=created_at.desc"),
    get("tasks?select=*&order=due_date.asc"),
    get("activities?select=*&order=created_at.desc"),
    get("review_requests?select=*&order=send_after.asc"),
    get("app_settings?select=*"),
    get("appointments?select=*&order=slot_date.asc")
  ]);
  cache.stages = r[0]||[]; cache.deals = r[1]||[]; cache.contacts = r[2]||[];
  cache.tasks = r[3]||[]; cache.activities = r[4]||[];
  cache.reviews = r[5]||[];
  cache.settings = {};
  (r[6]||[]).forEach(function(row){ cache.settings[row.key] = row.value; });
  cache.appts = r[7]||[];
}

/* ---------- helpers ---------- */
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function money(n){ return n ? "$" + Number(n).toLocaleString() : ""; }
/* The lead-photos bucket is private, so every image needs a short-lived signed
   URL minted with the logged-in user's token. Nothing here is ever a public
   link: these are photographs of customers' homes. */
async function signedPhotoUrls(paths){
  if(!paths || !paths.length) return [];
  var out = [];
  for(var i=0;i<paths.length;i++){
    try{
      var r = await fetch(SB_URL + "/storage/v1/object/sign/lead-photos/" + paths[i], {
        method:"POST",
        headers:{ "apikey":SB_KEY,
                  "Authorization":"Bearer " + (session ? session.access_token : SB_KEY),
                  "Content-Type":"application/json" },
        body: JSON.stringify({ expiresIn: 3600 })
      });
      if(!r.ok) continue;
      var d = await r.json();
      if(d && d.signedURL) out.push(SB_URL + "/storage/v1" + d.signedURL);
    }catch(e){ /* a missing photo must not break the contact page */ }
  }
  return out;
}

function el(id){ return document.getElementById(id); }
function contactById(id){ return cache.contacts.filter(function(c){ return c.id===id; })[0]; }
function srcBadge(s){
  var map = {
    "website":       { cls:"b-web",   label:"roofing" },
    "solar-battery": { cls:"b-solar", label:"battery" },
    "restoration":   { cls:"b-resto", label:"water damage" }
  };
  var m = map[s] || { cls:"b-manual", label: s || "manual" };
  return '<span class="badge '+m.cls+'">'+esc(m.label)+'</span>';
}
function isOverdue(t){
  if(!t.due_date || t.done) return false;
  return new Date(t.due_date) < new Date(new Date().toDateString());
}

/* ---------- render ---------- */
function render(){
  if(!session){ renderLogin(); return; }
  el("root").innerHTML =
    '<div class="shell">' + sidebar() + '<main class="main" id="main"></main></div>';
  wireNav();
  renderView();
}

function sidebar(){
  var email = session && session.user ? session.user.email : "";
  function b(k,label){ return '<button data-nav="'+k+'"'+(view.name===k?' class="on"':'')+'>'+label+'</button>'; }
  return '<aside class="side">'
    + '<div class="brandrow"><span class="bmark">&#127968;</span><div>'

/* ---------- pipeline ---------- */
function viewPipeline(){
  var open = cache.deals.filter(function(d){
    var s = cache.stages.filter(function(x){return x.id===d.stage_id;})[0];
    return s && s.name!=="Won" && s.name!=="Lost";
  });
  var total = open.reduce(function(a,d){ return a + (Number(d.value_estimate)||0); }, 0);

  var cols = cache.stages.map(function(s){
    var ds = cache.deals.filter(function(d){ return d.stage_id===s.id; });
    var cards = ds.map(function(d){
      var c = contactById(d.contact_id);
      var opts = cache.stages.map(function(x){
        return '<option value="'+x.id+'"'+(x.id===d.stage_id?' selected':'')+'>'+esc(x.name)+'</option>';
      }).join("");
      return '<div class="deal" draggable="true" data-deal="'+d.id+'">'
        + '<div class="dtitle">'+esc(d.title)+'</div>'
        + (c ? '<button class="rlink" style="font-size:.8rem;font-weight:600" data-open="'+c.id+'">'+esc(c.name)+'</button>' : '')
        + (d.service_type ? '<div class="dsvc">'+esc(d.service_type)+'</div>' : '')
        + '<div class="dmeta">'
        + (d.value_estimate ? '<span class="dval">'+money(d.value_estimate)+'</span>' : '<span class="muted" style="font-size:.78rem">No estimate</span>')
        + '<select data-stage="'+d.id+'">'+opts+'</select></div></div>';
    }).join("");
    return '<div class="col" data-col="'+s.id+'">'
      + '<div class="colhead" style="border-top-color:'+esc(s.color)+'"><span>'+esc(s.name)+'</span>'
      + '<span class="pill">'+ds.length+'</span></div>'
      + '<div class="colbody">'+(cards || '<div class="hint">Nothing here yet.</div>')+'</div></div>';
  }).join("");

  el("main").innerHTML =
    '<div class="head"><div><h1>Pipeline</h1><p class="muted">'
    + cache.deals.length + ' deal' + (cache.deals.length===1?'':'s')
    + ' &middot; Open value: <strong>' + (money(total)||"$0") + '</strong></p></div>'
    + '<button class="btn btn-p" id="nd">+ New Deal</button></div>'
    + '<div id="err"></div><div class="board">' + cols + '</div>';

  Array.prototype.forEach.call(document.querySelectorAll("[data-stage]"), function(sel){
    sel.onchange = function(){ moveDeal(sel.getAttribute("data-stage"), Number(sel.value)); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(b){
    b.onclick = function(){ view = { name:"contact", contactId:b.getAttribute("data-open") }; render(); };
  });
  wireDrag();
  el("nd").onclick = function(){ newDealModal(); };
}

function wireDrag(){
  var dragId = null;
  Array.prototype.forEach.call(document.querySelectorAll(".deal"), function(d){
    d.ondragstart = function(){ dragId = d.getAttribute("data-deal"); d.classList.add("drag"); };
    d.ondragend = function(){ d.classList.remove("drag"); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-col]"), function(c){
    c.ondragover = function(e){ e.preventDefault(); };
    c.ondrop = function(e){
      e.preventDefault();
      if(dragId) moveDeal(dragId, Number(c.getAttribute("data-col")));
      dragId = null;
    };
  });
}

async function moveDeal(dealId, stageId){
  var d = cache.deals.filter(function(x){ return x.id===dealId; })[0];
  if(!d || d.stage_id===stageId) return;
  var prev = d.stage_id;
  d.stage_id = stageId;
  renderView();
  try{
    await patch("deals?id=eq."+dealId, { stage_id: stageId });
    var s = cache.stages.filter(function(x){ return x.id===stageId; })[0];
    var a = await post("activities", { contact_id:d.contact_id, deal_id:dealId, type:"status_change",
                                        body:"Deal moved to " + (s?s.name:"a new stage") + "." });
    if(a && a[0]) cache.activities.unshift(a[0]);
  }catch(e){
    d.stage_id = prev; renderView();
    if(el("err")) el("err").innerHTML = '<div class="banner err">'+esc(e.message)+'</div>';
  }
}

function drawContacts(q){
  q = (q||"").toLowerCase();
  var rows = cache.contacts.filter(function(c){
    return !q || [c.name,c.email,c.phone,c.city,c.address].some(function(v){
      return v && String(v).toLowerCase().indexOf(q) > -1;
    });
  }).map(function(c){
    // data-label drives the stacked card layout on phones, where the table
    // collapses to one row per line and the <thead> is hidden.
    // The phone is a tel: link so a lead can be called with one tap.
    var tel = c.phone
      ? '<a href="tel:'+esc(String(c.phone).replace(/[^0-9+]/g,""))+'">'+esc(c.phone)+'</a>'
      : "—";
    return '<tr><td data-label="Name"><button class="rlink" data-open="'+c.id+'">'+esc(c.name)+'</button></td>'
      + '<td data-label="Phone">'+tel+'</td><td data-label="Email">'+esc(c.email||"—")+'</td>'
      + '<td data-label="Address">'+esc(c.address||"—")+'</td>'
      + '<td data-label="City">'+esc(c.city||"—")+'</td>'
      + '<td data-label="Source">'+srcBadge(c.source)+'</td>'
      + '<td data-label="Added">'+new Date(c.created_at).toLocaleDateString()+'</td></tr>';
  }).join("");
  el("tbl").innerHTML = '<div class="tscroll"><table><thead><tr><th>Name</th><th>Phone</th><th>Email</th><th>Address</th><th>City</th>'
    + '<th>Source</th><th>Added</th></tr></thead><tbody>'
    + (rows || '<tr><td colspan="7" class="muted">No contacts found.</td></tr>') + '</tbody></table></div>';
  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(b){
    b.onclick = function(){ view = { name:"contact", contactId:b.getAttribute("data-open") }; render(); };
  });
}

function wireTaskToggles(){

/* ---------- reviews ---------- */
/* The map pack is gated on review count, and the third slot for "phoenix
   roofing companies" sits at 28 reviews. This screen exists so the ask happens
   every single time a job closes instead of whenever someone remembers. */
function reviewMsg(c, deal){
  var url = cache.settings.google_review_url || "";
  var first = String(c && c.name || "").trim().split(/\s+/)[0] || "there";
  // Customers type their own city, so "San tan valley" comes through as typed.
  // Title-case it for the message rather than quoting it back at them oddly.
  var city = (c && c.city) ? String(c.city).trim().toLowerCase().replace(/\b[a-z]/g, function(m){ return m.toUpperCase(); }) : "";
  var svc  = (deal && deal.service_type) ? String(deal.service_type).trim().toLowerCase() : "";

  // The ask PROMPTS for specifics; it never supplies the words. Google reads
  // review text for relevance, so "replaced the underlayment on our tile roof
  // in Gilbert" makes us findable for that work in that city in a way that
  // "great job" never will. But the customer has to write it, in their words,
  // about what actually happened - anything else is coordinated review content
  // and risks the whole profile.
  var hint = "";
  if (svc && city)      hint = "If you get a second, mentioning the " + svc + " and that you're in " + city + " really helps neighbors find us. ";
  else if (svc)         hint = "If you get a second, mentioning the " + svc + " really helps neighbors find us. ";
  else if (city)        hint = "If you get a second, mentioning that you're in " + city + " really helps neighbors find us. ";

  return "Hi " + first + ", thanks again for letting us work on your roof. "
       + "If we did right by you, would you mind leaving a quick Google review? "
       + hint
       + "A photo of the finished roof helps too, if you have one. " + url;
}

function viewReviews(){
  var url = cache.settings.google_review_url;
  var now = new Date();

  var rows = (cache.reviews||[]).slice().sort(function(a,b){
    return new Date(a.send_after) - new Date(b.send_after);
  });
  var due     = rows.filter(function(r){ return r.status==="scheduled" && new Date(r.send_after) <= now; });
  var waiting = rows.filter(function(r){ return r.status==="scheduled" && new Date(r.send_after) >  now; });
  var done    = rows.filter(function(r){ return r.status!=="scheduled"; });

  function card(r, isDue){
    var c = contactById(r.contact_id) || {};
    var d = (cache.deals||[]).filter(function(x){ return x.id===r.deal_id; })[0];
    var when = new Date(r.send_after);
    var phone = String(c.phone||"").replace(/[^0-9+]/g,"");
    var body  = encodeURIComponent(reviewMsg(c, d));
    var acts  = "";
    if(isDue && url){
      acts = (phone ? '<a class="btn btn-p" href="sms:'+phone+'?&body='+body+'">Text request</a>' : '')
           + (c.email ? '<a class="btn" href="mailto:'+esc(c.email)
               +'?subject='+encodeURIComponent("Thanks from Phoenix Roofing Experts")
               +'&body='+body+'">Email</a>' : '')
           + '<button class="btn" data-rvsent="'+r.id+'">Mark sent</button>'
           + '<button class="linkbtn" data-rvskip="'+r.id+'">Skip</button>';
    } else if(isDue && !url){
      acts = '<span class="muted">Add your Google review link below to enable sending.</span>';
    } else if(r.status==="scheduled"){
      acts = '<span class="muted">Due '+when.toLocaleDateString()+'</span>'
           + '<button class="linkbtn" data-rvnow="'+r.id+'">Send now</button>';
    } else {
      acts = '<span class="muted">'+esc(r.status)+(r.sent_at?" &middot; "+new Date(r.sent_at).toLocaleDateString():"")+'</span>';
    }
    return '<div class="taskrow"><div>'
      + '<button class="rlink" data-open="'+esc(r.contact_id)+'">'+esc(c.name||"Unknown")+'</button>'
      + (d ? '<div class="muted" style="font-size:.8rem">'+esc(d.title)+'</div>' : '')
      + '</div><div class="rvacts">'+acts+'</div></div>';
  }

  el("main").innerHTML =
    '<div class="head"><div><h1>Reviews</h1><p class="muted">'
    + due.length + ' ready to send &middot; ' + waiting.length + ' waiting &middot; ' + done.length + ' handled'
    + '</p></div></div><div id="err"></div>'
    + (!url ? '<div class="banner err" style="margin-bottom:18px">'
        + '<strong>Setup needed.</strong> Paste your Google review link below and every won job '
        + 'will queue a request automatically.</div>' : '')
    + '<section class="panel"><h3>Ready to send ('+due.length+')</h3>'
    + (due.length ? '<div class="tasks">'+due.map(function(r){return card(r,true);}).join("")+'</div>'
                  : '<div class="hint">Nothing due. Requests appear here '
                    + (cache.settings.review_delay_hours||48) + ' hours after a deal is marked Won.</div>')
    + '</section>'
    + (waiting.length ? '<section class="panel"><h3>Waiting ('+waiting.length+')</h3><div class="tasks">'
        + waiting.map(function(r){return card(r,false);}).join("")+'</div></section>' : '')
    + (done.length ? '<section class="panel"><h3>Handled ('+done.length+')</h3><div class="tasks">'
        + done.slice(0,15).map(function(r){return card(r,false);}).join("")+'</div></section>' : '')
    + '<section class="panel"><h3>Settings</h3>'
    + '<div class="field" style="margin-bottom:12px"><label>Google review link</label>'
    + '<input id="rvurl" placeholder="https://g.page/r/..../review" value="'+esc(url||"")+'"></div>'
    + '<p class="muted" style="font-size:.82rem">Google Business Profile &rarr; <em>Ask for reviews</em> &rarr; copy link.</p>'
    + '<div class="field" style="margin:12px 0"><label>Wait this many hours after a job is won</label>'
    + '<input id="rvdelay" type="number" min="0" value="'+esc(cache.settings.review_delay_hours||"48")+'"></div>'
    + '<button class="btn btn-p" id="rvsave">Save settings</button></section>';

  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(b){
    b.onclick = function(){ view = { name:"contact", contactId:b.getAttribute("data-open") }; render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-rvsent]"), function(b){
    b.onclick = function(){ setReview(b.getAttribute("data-rvsent"), { status:"sent", sent_at:new Date().toISOString() }); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-rvskip]"), function(b){
    b.onclick = function(){ setReview(b.getAttribute("data-rvskip"), { status:"skipped" }); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-rvnow]"), function(b){
    b.onclick = function(){ setReview(b.getAttribute("data-rvnow"), { send_after:new Date().toISOString() }); };
  });
  el("rvsave").onclick = saveReviewSettings;
}

async function setReview(id, patch){
  var r = (cache.reviews||[]).filter(function(x){ return String(x.id)===String(id); })[0];
  if(!r) return;
  var before = Object.assign({}, r);
  Object.assign(r, patch);          // optimistic
  renderView();
  try{
    await api("review_requests?id=eq."+encodeURIComponent(id),
      { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body:JSON.stringify(patch) });
  }catch(e){
    Object.assign(r, before); renderView();
    if(el("err")) el("err").innerHTML = '<div class="banner err">'+esc(e.message)+'</div>';
  }
}

async function saveReviewSettings(){
  var url = el("rvurl").value.trim();
  var delay = String(parseInt(el("rvdelay").value, 10) || 48);
  try{
    await api("app_settings?on_conflict=key",
      { method:"POST",
        headers:{ "Prefer":"resolution=merge-duplicates,return=minimal" },
        body: JSON.stringify([{ key:"google_review_url", value:url||null },
                              { key:"review_delay_hours", value:delay }]) });
    cache.settings.google_review_url = url || null;
    cache.settings.review_delay_hours = delay;
    renderView();
  }catch(e){
    if(el("err")) el("err").innerHTML = '<div class="banner err">'+esc(e.message)+'</div>';
  }
}

/* ---------- inspections ---------- */
/* Bookings arrive from the roof age check with a date, a window, an address and
   whatever the homeowner is worried about. They are the highest-intent thing
   this business receives, so they get their own screen rather than being
   buried in a contact record. */
function apptDate(d){
  var dt = new Date(d + "T12:00:00");
  return dt.toLocaleDateString(undefined, { weekday:"short", month:"short", day:"numeric" });
}
function isToday(d){
  var t = new Date(); t.setHours(0,0,0,0);
  return new Date(d + "T12:00:00").getTime() === t.getTime();
}
function isPast(d){
  var t = new Date(); t.setHours(0,0,0,0);
  return new Date(d + "T12:00:00") < t;
}

function viewAppts(){
  var rows = (cache.appts||[]).slice();
  var needsConfirm = rows.filter(function(a){ return a.status==="requested" && !isPast(a.slot_date); });
  var upcoming     = rows.filter(function(a){ return a.status==="confirmed" && !isPast(a.slot_date); });
  var past         = rows.filter(function(a){ return isPast(a.slot_date) || a.status==="completed"
                                                  || a.status==="cancelled" || a.status==="no-show"; });

  function card(a, showActions){
    var c = contactById(a.contact_id) || {};
    var phone = String(c.phone||"").replace(/[^0-9+]/g,"");
    var maps = "https://maps.google.com/?q=" + encodeURIComponent(a.address + ", " + (a.city||"Phoenix") + ", AZ");
    var today = isToday(a.slot_date);
    return '<div class="taskrow' + (today ? " over" : "") + '" style="align-items:flex-start">'
      + '<div style="min-width:0">'
      + '<div style="display:flex;gap:9px;align-items:baseline;flex-wrap:wrap">'
      +   '<strong style="color:var(--navy)">' + esc(apptDate(a.slot_date)) + '</strong>'
      +   '<span class="badge ' + (a.slot_window==="morning" ? "b-web" : "b-solar") + '">'
      +     esc(a.slot_window==="morning" ? "8am–12pm" : "12pm–4pm") + '</span>'
      +   (today ? '<span class="overtxt">TODAY</span>' : '')
      + '</div>'
      + '<div style="margin-top:6px"><button class="rlink" data-open="'+esc(a.contact_id)+'">'
      +   esc(c.name || "Unknown") + '</button></div>'
      + (c.phone ? '<div><a href="tel:'+phone+'">'+esc(c.phone)+'</a></div>' : '')
      + '<div style="font-size:.85rem;margin-top:2px"><a href="'+maps+'" target="_blank" rel="noopener">&#128205; '
      +   esc(a.address) + (a.city ? ", " + esc(a.city) : "") + '</a></div>'
      + (a.concern ? '<div class="muted" style="font-size:.85rem;margin-top:6px">&ldquo;'+esc(a.concern)+'&rdquo;</div>' : '')
      + '</div>'
      + '<div class="rvacts">'
      + (showActions
          ? (a.status==="requested"
              ? '<button class="btn btn-p" data-apok="'+a.id+'">Confirm</button>'
              : '<button class="btn" data-apdone="'+a.id+'">Mark done</button>')
            + '<button class="linkbtn" data-apno="'+a.id+'">Cancel</button>'
          : '<span class="muted" style="font-size:.82rem">'+esc(a.status)+'</span>')
      + '</div></div>';
  }

  el("main").innerHTML =
    '<div class="head"><div><h1>Visits</h1><p class="muted">'
    + needsConfirm.length + ' to confirm &middot; ' + upcoming.length + ' upcoming</p></div></div>'
    + '<div id="err"></div>'
    + (needsConfirm.length
        ? '<section class="panel"><h3>Needs confirming ('+needsConfirm.length+')</h3>'
          + '<p class="muted" style="font-size:.86rem;margin-top:-6px">They booked themselves and are '
          + 'expecting a text back. Confirm quickly &mdash; that message is the first thing they judge you on.</p>'
          + '<div class="tasks">'+needsConfirm.map(function(a){return card(a,true);}).join("")+'</div></section>'
        : '')
    + '<section class="panel"><h3>Upcoming ('+upcoming.length+')</h3>'
    + (upcoming.length ? '<div class="tasks">'+upcoming.map(function(a){return card(a,true);}).join("")+'</div>'
                       : '<div class="hint">Nothing on the calendar yet. Bookings come in from the roof age check page.</div>')
    + '</section>'
    + (past.length ? '<section class="panel"><h3>Past ('+past.length+')</h3><div class="tasks">'
        + past.slice(0,12).map(function(a){return card(a,false);}).join("")+'</div></section>' : '');

  Array.prototype.forEach.call(document.querySelectorAll("[data-open]"), function(b){
    b.onclick = function(){ view = { name:"contact", contactId:b.getAttribute("data-open") }; render(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-apok]"), function(b){
    b.onclick = function(){ setAppt(b.getAttribute("data-apok"),
      { status:"confirmed", confirmed_at:new Date().toISOString() }); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-apdone]"), function(b){
    b.onclick = function(){ setAppt(b.getAttribute("data-apdone"), { status:"completed" }); };
  });
  Array.prototype.forEach.call(document.querySelectorAll("[data-apno]"), function(b){
    b.onclick = function(){ setAppt(b.getAttribute("data-apno"), { status:"cancelled" }); };
  });
}

async function setAppt(id, patch){
  var a = (cache.appts||[]).filter(function(x){ return String(x.id)===String(id); })[0];
  if(!a) return;
  var before = Object.assign({}, a);
  Object.assign(a, patch);
  renderView();
  try{
    await api("appointments?id=eq."+encodeURIComponent(id),
      { method:"PATCH", headers:{ "Prefer":"return=minimal" }, body:JSON.stringify(patch) });
  }catch(e){
    Object.assign(a, before); renderView();
    if(el("err")) el("err").innerHTML = '<div class="banner err">'+esc(e.message)+'</div>';
  }
}

/* ---------- modals ---------- */
function modal(title, inner){
  var d = document.createElement("div");
  d.className = "ovl";
  d.innerHTML = '<div class="modal"><div class="mhead"><h3 style="margin:0">'+title+'</h3>'
    + '<button class="icon" data-x>&#10005;</button></div><div class="mbody">'+inner+'</div></div>';
  d.onclick = function(e){ if(e.target===d) document.body.removeChild(d); };
  d.querySelector("[data-x]").onclick = function(){ document.body.removeChild(d); };
  document.body.appendChild(d);
  return d;
}

var SERVICES = ["Roof Repair","Roof Replacement & Installation","Residential Roofing",
  "Commercial Roofing","Spray Foam Roofing","Clay Tile Roofing","Battery Storage"];

function newContactModal(){
  var m = modal("New Contact",
    '<form id="cf" class="stack"><div class="field"><label>Name*</label><input id="cn" required></div>'
    + '<div class="fg"><div class="field"><label>Phone</label><input id="cp"></div>'
    + '<div class="field"><label>Email</label><input id="ce" type="email"></div></div>'
    + '<div class="field"><label>Address</label><input id="ca" autocomplete="street-address"></div>'
    + '<div class="field"><label>City</label><input id="cc" value="Phoenix"></div>'
    + '<div class="field"><label>Notes</label><textarea id="cno"></textarea></div>'
    + '<div id="cerr"></div><div class="macts"><button type="button" class="btn" data-cancel>Cancel</button>'
    + '<button type="submit" class="btn btn-p">Create</button></div></form>');
  m.querySelector("[data-cancel]").onclick = function(){ document.body.removeChild(m); };
  m.querySelector("#cf").onsubmit = async function(e){
    e.preventDefault();
    try{
      var c = await post("contacts", { name:el("cn").value.trim(), phone:el("cp").value.trim()||null,
        email:el("ce").value.trim()||null, city:el("cc").value.trim()||null,
        address:el("ca").value.trim()||null,
        notes:el("cno").value.trim()||null, source:"manual" });
      if(c && c[0]) cache.contacts.unshift(c[0]);
      document.body.removeChild(m); renderView();
    }catch(err){
      m.querySelector("#cerr").innerHTML = '<div class="banner err">'+esc(err.message)+'</div>';
    }
  };
}

function newDealModal(contactId){
  // Guard against being wired straight to onclick, which would pass an Event.
  if(typeof contactId !== "string") contactId = null;
  var contactField = contactId ? "" :
    '<div class="field"><label>Contact*</label><select id="dc" required><option value="">Select…</option>'
    + cache.contacts.map(function(c){ return '<option value="'+c.id+'">'+esc(c.name)+'</option>'; }).join("")
    + '</select></div>';
  var m = modal("New Deal",
    '<form id="df" class="stack">' + contactField
    + '<div class="field"><label>Title*</label><input id="dt" required placeholder="e.g. Smith residence re-roof"></div>'
    + '<div class="fg"><div class="field"><label>Service</label><select id="ds">'
    + SERVICES.map(function(s){ return '<option>'+esc(s)+'</option>'; }).join("") + '</select></div>'
    + '<div class="field"><label>Estimate ($)</label><input id="dv" type="number"></div></div>'
    + '<div class="field"><label>Stage</label><select id="dst">'
    + cache.stages.map(function(s){ return '<option value="'+s.id+'">'+esc(s.name)+'</option>'; }).join("")
    + '</select></div><div id="derr"></div>'
    + '<div class="macts"><button type="button" class="btn" data-cancel>Cancel</button>'
    + '<button type="submit" class="btn btn-p">Create</button></div></form>');
  m.querySelector("[data-cancel]").onclick = function(){ document.body.removeChild(m); };
  m.querySelector("#df").onsubmit = async function(e){
    e.preventDefault();
    try{
      var cid = contactId || el("dc").value;
      if(!cid) throw new Error("Select a contact.");
      var d = await post("deals", { contact_id:cid, title:el("dt").value.trim(),
        service_type:el("ds").value, value_estimate: el("dv").value ? Number(el("dv").value) : null,
        stage_id: Number(el("dst").value) });
      if(d && d[0]){
        cache.deals.unshift(d[0]);
        var a = await post("activities", { contact_id:cid, deal_id:d[0].id, type:"note",
                                            body:"Deal created: " + d[0].title });
        if(a && a[0]) cache.activities.unshift(a[0]);
      }
      document.body.removeChild(m); renderView();
    }catch(err){
      m.querySelector("#derr").innerHTML = '<div class="banner err">'+esc(err.message)+'</div>';
    }
  };
}

/* ---------- boot ---------- */
(async function(){
  session = loadSession();
  if(session){
    try { await loadAll(); }
    catch(e){
      if(await refreshSession()){
        try { await loadAll(); } catch(e2){ signOut(); return; }
      } else { signOut(); return; }
    }
  }
  render();
})();
</script>
