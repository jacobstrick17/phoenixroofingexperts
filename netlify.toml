# Netlify config for the Phoenix Roofing Experts site.
# Deploy: point Netlify at this `site` folder. No build command needed.

[build]
  publish = "."
  command = ""

# Serve /roof-repair instead of /roof-repair.html when someone types it.
[[redirects]]
  from = "/services/:slug"
  to = "/services/:slug.html"
  status = 200

[[redirects]]
  from = "/service-areas/:slug"
  to = "/service-areas/:slug.html"
  status = 200

# Custom 404 for anything unmatched.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
